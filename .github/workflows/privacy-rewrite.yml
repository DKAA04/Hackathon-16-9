name: Remove personal test number from history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-number-history-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install history filter
        run: python -m pip install git-filter-repo==2.47.0
      - name: Rewrite only the known personal number and preserve repository history
        shell: python
        run: |
          import os, pathlib, re, subprocess, tempfile
          def git(*args):
              return subprocess.check_output(['git', *args])
          remote = git('remote', 'get-url', 'origin').decode().strip()
          if os.environ['GITHUB_REPOSITORY'] != 'DKAA04/Hackathon-16-9':
              raise SystemExit('Wrong repository.')
          run_sha = os.environ['GITHUB_SHA']
          if git('rev-parse', run_sha + '^').decode().strip() != '26c1d1f7cbbbf2ba93b48dbab00244ac4cc9cb6f':
              raise SystemExit('This one-time cleanup is no longer applicable.')
          before = {'refs/heads/main': run_sha, 'refs/heads/backend-final': '6bc139cfb3b4ccc5ec72e7f89be6b9148e269b25'}
          observed = {ref: sha for sha, ref in (line.split() for line in git('ls-remote', '--heads', 'origin').decode().splitlines())}
          if any(observed.get(ref) != sha for ref, sha in before.items()):
              raise SystemExit('Branch changed; no rewrite will be attempted.')
          for ref in before:
              git('fetch', 'origin', '+' + ref + ':' + ref, '--update-head-ok')
          historical = git('show', '23ea3d73e4bdce7a610e2a3d49227027282ed059:backend/.env.example')
          matches = set(re.findall(rb'\+32\d{8,10}', historical))
          if len(matches) != 1:
              raise SystemExit('Expected one known historical test number; stopped without changing remote refs.')
          number = matches.pop()
          with tempfile.TemporaryDirectory() as td:
              rule = pathlib.Path(td) / 'redact.txt'
              rule.write_bytes(number + b'==>+32000000000\n')
              rule.chmod(0o600)
              subprocess.run(['git-filter-repo', '--force', '--replace-text', str(rule), '--replace-message', str(rule)], check=True)
          refs = list(before)
          objects = git('rev-list', '--objects', *refs).splitlines()
          for item in objects:
              oid = item.split()[0].decode()
              kind = git('cat-file', '-t', oid).strip()
              if kind in (b'blob', b'commit', b'tag') and number in git('cat-file', '-p', oid):
                  raise SystemExit('Redaction verification failed; remote unchanged.')
          if 'origin' not in git('remote').decode().split():
              subprocess.run(['git', 'remote', 'add', 'origin', remote], check=True)
          changed = [(ref, old, git('rev-parse', ref).decode().strip()) for ref, old in before.items()]
          changed = [(ref, old, new) for ref, old, new in changed if old != new]
          command = ['git', 'push', '--atomic', 'origin']
          command += [f'--force-with-lease={ref}:{old}' for ref, old, new in changed]
          command += [f'{new}:{ref}' for ref, old, new in changed]
          if changed:
              subprocess.run(command, check=True)
          print(f'Verified {len(objects)} reachable objects; updated {len(changed)} branches/tags.')
          print('Read-only pull-request refs and external forks require separate cleanup.')
