<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DuckDuckGov: welke ondernemingen zijn echt actief in de gemeente, en waarop baseren we dat?" />
  <meta name="theme-color" content="#07110f" />
  <link rel="icon" type="image/png" href="/duckduckgov-logo.png" />
  <link rel="apple-touch-icon" href="/duckduckgov-logo.png" />
  <link rel="preload" as="image" href="/duckduckgov-logo.png" />
  <title>DuckDuckGov</title>
  <!-- Splash styles live here so the splash looks the same before and after the app bundle loads. -->
  <style>
    html, body { margin: 0; height: 100%; background: #07110f; }
    .splash {
      position: fixed; inset: 0; z-index: 5000; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; padding: 24px;
      background: radial-gradient(circle at 50% 38%, #163324 0, #07110f 55%);
      color: #f3f7f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .splash.leaving { opacity: 0; visibility: hidden; }
    .splash-card {
      width: min(300px, 70vw); aspect-ratio: 1; border-radius: 36px; overflow: hidden; background: #fff;
      box-shadow: 0 24px 60px #000a;
    }
    .splash-card img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .splash-tagline { margin: 4px 0 0; max-width: 560px; text-align: center; color: #c6d2cd; font-size: 15px; line-height: 1.5; }
    .splash-progress { width: 200px; height: 4px; overflow: hidden; border-radius: 9px; background: #20332c; }
    .splash-progress i {
      display: block; width: 40%; height: 100%; border-radius: inherit; background: #b7ff3c;
      animation: splash-load 1.1s ease-in-out infinite alternate;
    }
    .splash-status { color: #91a59c; font: 12px "JetBrains Mono", Consolas, ui-monospace, monospace; letter-spacing: .04em; }
    @keyframes splash-load { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
    @media (prefers-reduced-motion: reduce) {
      .splash { transition: none; }
      .splash-progress i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="splash" role="status" aria-live="polite">
      <div class="splash-card"><img src="/duckduckgov-logo.png" alt="DuckDuckGov" width="300" height="300" /></div>
      <p class="splash-tagline">Welke ondernemingen zijn echt actief, en waarop baseren we dat?</p>
      <div class="splash-progress" aria-hidden="true"><i></i></div>
      <small class="splash-status">Laden…</small>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
